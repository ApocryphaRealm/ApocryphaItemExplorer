;; ApocryphaRealm Item Explorer
;;
;; Browse every plugin your game loaded and the items each one adds, and take any of them.
;; This mod ships no ESP and runs no Papyrus. It needs the Apocrypha Menu Framework (or SKSE
;; Menu Framework 3+) for its page; without one, the DevBench tool still works.

[General]
;; How many an Add gives when you have not changed the count on the page.
uDefaultCount = 1

;; List spells alongside items. Taking a spell teaches it rather than putting it in a bag.
bIncludeSpells = 1

;; Show the selected item's own model. OFF, and deliberately so: the model loads and reaches the
;; game's own UI 3D scene, but nothing is drawn yet, so turning this on gets you the pane markings
;; and no picture. Left here, and off, rather than removed - see the mod's changelog.
bShow3DPreview = 1

;; Show items that a quest calls its own. They are always tagged [quest] when shown, because
;; handing yourself one can confuse the quest that owns it. Turn this off to hide them entirely.
bShowQuestItems = 1

;; How lists are ordered:
;;   0 name A-Z          1 name Z-A
;;   2 value, highest    3 value, lowest
;;   4 weight, heaviest  5 weight, lightest
uSortMode = 0

[Preview]
;; Where the selected item's model appears, and how big it is.
;;
;; The model is drawn by the GAME, earlier in the frame than this mod's page is drawn over it -
;; so wherever the two overlap, the page wins and the model is hidden behind it. The pane is
;; therefore movable, and it starts on the right-hand side of the screen, clear of a centred
;; menu window. All three are fractions of the screen: 0.5, 0.5 is dead centre.
fPaneX = 0.800
fPaneY = 0.500
fPaneSize = 0.280

;; Mark the pane with corner brackets and the item's name above it. The middle is deliberately
;; left unpainted - anything drawn there would cover the model it is framing.
bShowFrame = 1

;; How a place on the screen becomes a place in the game's inventory renderer, whose units are
;; its own and are not pixels. Linear: a fixed depth, plus a horizontal and a vertical offset
;; taken from how far the pane sits from the middle of the screen. The spans carry the sign, so
;; an axis that runs the other way is a change here rather than a new build.
fMapDepth = 25.000
fMapBaseY = 0.000
fMapBaseZ = 0.000
fMapSpanX = 40.000
fMapSpanY = 22.500
fMapScale = 1.000

;; The UI 3D scene's camera. The model is attached to the game's own menu scene, which the game
;; renders inside its own pass - the mod does not issue the draw itself, because a draw issued
;; from the menu overlay happens after that pass has finished and produces nothing at all.
;; Move the UI scene's camera. OFF: the game's own item menus never do, and moving it to
;; the origin points it away from the model.
bOverrideCamera = 0
fCamFov = 45.000
fCamX = 0.000
fCamY = 0.000
fCamZ = 0.000

;; Which INTERFACE_LIGHT_SCHEME the model is attached under and rendered with. 1 is
;; kInventory, the inventory's own.
uScheme = 1

;; THE CONFIGURATION SWEEP - diagnostic, and it is why this build exists.
;;
;; A mod's own menu CAN host the game's item 3D: UIExtensions ships magicmenuext, a
;; non-vanilla menu that does exactly that. What is not known is which part of how THIS menu
;; is set up differs from the one that works. These three make it a runtime choice so every
;; combination can be tried in ONE game launch, driven from the DevBench tool
;; (itemexplorer.control op=config:<recipe>,<loadMode>,<marker>).
;;
;; uMenuRecipe - the flags the menu is built with:
;;   0  InventoryMenu's own set (kCustomRendering | kInventoryItemMenu | kRequiresUpdate |
;;      kPausesGame, depth 3) - what 1.0.3 tried, and it drew nothing
;;   1  SKSE's own CustomMenu item-display block (kModal | kPausesGame |
;;      kRendersOffscreenTargets, depth 0xA) - the recipe UIExtensions ships
;;   2  recipe 1 without kRendersOffscreenTargets, to isolate that one flag
;;   3  recipe 1 plus kCustomRendering and kInventoryItemMenu
uMenuRecipe = 1

;; uLoadMode - which overload builds the model. 0 is LoadInventoryItem(InventoryEntryData*),
;; the one the game's own handler tail-calls; 1 is the bound-object overload SKSE's block
;; calls. Both have been tried before; neither has been tried against these flag recipes.
uLoadMode = 0

;; bMarkerMovie - give the menu a movie that DRAWS a small marker rectangle instead of the
;; blank one. It is the observable that tells "the game never composited this menu" apart
;; from "it composited it and the 3D was absent" - two failures that have looked identical.
bMarkerMovie = 1

[Debug]
;; 0 trace, 1 debug, 2 info, 3 warn, 4 error, 5 critical, 6 off.
;; Ships at 0 so a log sent with a bug report is already diagnostic.
uLogLevel = 0
