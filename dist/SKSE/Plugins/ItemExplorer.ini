;; ApocryphaRealm Item Explorer
;;
;; Browse every plugin your game loaded and the items each one adds, and take any of them.
;; This mod ships no ESP and runs no Papyrus. It needs the Apocrypha Menu Framework (or SKSE
;; Menu Framework 3+) for its page; without one, the DevBench tool still works.

[General]
;; How many an Add gives when you have not changed the count on the page.
uDefaultCount = 1

;; List spells alongside items. Taking a spell teaches it rather than putting it in a bag.
bIncludeSpells = 1

;; Item preview in the left pane: the switch on the Browse and Favourites pages starts at this each time the menu
;; opens. On, a card covers the menu's list of mods: the highlighted item as a 3D model at the top, its description
;; and inventory details below, following the highlight as you move down the list. While it shows, the game is
;; paused, the same way it is inside the inventory. Needs Apocrypha Menu Framework 2.3.0.
bPreviewInLeftPane = 1

;; Show items that a quest calls its own. They are always tagged [quest] when shown, because
;; handing yourself one can confuse the quest that owns it. Turn this off to hide them entirely.
bShowQuestItems = 1

;; Show items that have no in-game name - only an editor ID in their plugin file (many mods ship weapons, armour and
;; books like that). They are listed under the editor ID, read from the plugin file on disk, and tagged (no name).
;; Off by default: Skyrim.esm alone has hundreds of them (creature skins, tokens, test items). With it off, a
;; plugin's view says how many it hides.
bShowUnnamed = 0

;; How lists are ordered:
;;   0 name A-Z          1 name Z-A
;;   2 value, highest    3 value, lowest
;;   4 weight, heaviest  5 weight, lightest
uSortMode = 0

[Preview]
;; How much of the game's render fills the pane. 1 = as the inventory draws it; 0.5 = half size,
;; so a large model fits; 2 = twice, for something small.
fModelScale = 1

;; Nudge the model within the pane, in pixels (positive X moves it right, positive Y down).
fOffsetX = 0
fOffsetY = 0

;; The flat colour behind the model, 0-1 each. Black by default; the model is drawn opaque in front of it.
fBackgroundR = 0
fBackgroundG = 0
fBackgroundB = 0

[Debug]
;; 0 trace, 1 debug, 2 info, 3 warn, 4 error, 5 critical, 6 off.
;; Ships at 2 (info). For a bug report, set 0, reproduce, and send the log.
uLogLevel = 2
